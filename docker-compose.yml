services:
  nha-tho-online:
    build: .
    container_name: nha-tho-online
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persist BXH giáo xứ / nến (server.js lưu ./data.json)
      - ./data.json:/app/data.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
